
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School App - Monolith</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #172033;
    --muted: #718096;
    --border: #e8ecf3;
    --success: #059669;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 45px 20px;
    line-height: 1.6;
}

.container {
    max-width: 1050px;
    margin: auto;
}

/* Header */
.header {
    background: linear-gradient(120deg, #312e81, #4f46e5);
    color: white;
    padding: 32px;
    border-radius: 16px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(79, 70, 229, 0.18);
}

.header h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
}

.tag {
    display: inline-block;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    vertical-align: middle;
    margin-left: 8px;
}

.header p {
    color: #e0e7ff;
    font-size: 13px;
}

.header b {
    color: white;
}

/* Sections */
.section {
    background: var(--surface);
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(15, 23, 42, .035);
}

.section h2 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.section h2::before {
    content: "";
    width: 4px;
    height: 21px;
    background: var(--primary);
    border-radius: 5px;
}

/* Tables */
.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-bottom: 22px;
    text-align: left;
}

th {
    background: #f8f9fc;
    color: #64748b;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    font-weight: 700;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
}

td {
    padding: 15px 16px;
    border-bottom: 1px solid var(--border);
    color: #334155;
}

tbody tr:hover {
    background: #f8faff;
}

tbody tr:last-child td {
    border-bottom: none;
}

td:first-child {
    color: var(--muted);
    font-weight: 600;
}

/* Forms */
form {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 18px;
    border-top: 1px solid var(--border);
}

input, select {
    flex: 1;
    min-width: 180px;
    padding: 12px 14px;
    border: 1px solid #dce2ec;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: white;
    outline: none;
    transition: .2s;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, .1);
}

input::placeholder {
    color: #a0aabd;
}

/* Buttons */
button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(79, 70, 229, .2);
}

/* Responsive */
@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    .header {
        padding: 23px;
    }

    .header h1 {
        font-size: 23px;
    }

    .section {
        padding: 18px;
    }

    form {
        flex-direction: column;
    }

    input, select, button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>School App <span class="tag">MONOLITH</span></h1>
    </div>

    <div class="section">
        <h2>Courses</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                    </tr>
                </thead>
                <tbody>
                   {% for course in courses %}
                    <tr>
                        <td>{{ course.id }}</td>
                        <td>{{ course.title }}</td>
                    </tr>
                   {% endfor %}
                </tbody>
            </table>
        </div>

        <form method="post" action="/courses">
            <input name="title" placeholder="New course title" required>
            <button type="submit">+ Add course</button>
        </form>
    </div>

    <div class="section">
        <h2>Students</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody>
                     {% for student in students %}
                      <tr>
                            <td>{{ student.id }}</td>
                            <td>{{ student.name }}</td>
                            <td>{{ student.course }}</td>
                      </tr>
                     {% endfor %}
                </tbody>
            </table>
        </div>

        <form method="post" action="/students">
            <input name="name" placeholder="Student name" required>

            <select name="course_id">
                {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.title }}</option>
                {% endfor %}
            </select>

            <button type="submit">+ Add student</button>
        </form>
    </div>

</div>
</body>
</html>
